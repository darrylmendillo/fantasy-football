[project]
name = "yahoo-fantasy-mcp"
version = "0.1.0"
description = "Read-only MCP server for Yahoo Fantasy Football: league, roster, and live draft visibility"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.7",
    "yahoo_fantasy_api==2.12.3",
    "yahoo_oauth==2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
yahoo-fantasy-mcp = "yahoo_fantasy_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahoo_fantasy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
